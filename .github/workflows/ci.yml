name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  linux:
    name: Linux (fmt, clippy, tests against LibVLC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies (GPUI + LibVLC runtime and plugins)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libvlc-dev vlc-plugin-base \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libx11-xcb-dev \
            libvulkan-dev libfontconfig-dev libfreetype-dev libxcb1-dev libssl-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unit, LibVLC integration and UI tests
        run: cargo test --workspace --locked

  check:
    name: ${{ matrix.os }} (type-check)
    # Linking needs the platform LibVLC SDK; these jobs prove the native video adapters and the
    # rest of the crate compile for each target.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --lib --bins --locked -- -D warnings
